<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SARAIVA LABS • Sistemas Web, Gestão Logística & Administrativa</title>
  <style>
    :root {
      --emerald: #10b981;
      --emerald-dark: #059669;
      --emerald-deep: #064e3b;
      --emerald-glow: rgba(16, 185, 129, 0.22);
      --emerald-soft: rgba(16, 185, 129, 0.12);

      --dark-bg: #090e17;
      --dark-surface: #111927;
      --dark-border: #1e293b;

      --light-bg: #eef2f6;
      --light-surface: #ffffff;
      --light-border: #cbd5e1;

      --text-light: #f8fafc;
      --text-light-muted: #94a3b8;
      --text-dark: #0f172a;
      --text-dark-body: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--dark-bg);
      color: var(--text-light);
      line-height: 1.6;
      overflow-x: hidden;
    }

    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* NAVBAR DARK INTEGRADA À LOGO */
    nav {
      position: sticky;
      top: 0;
      background: rgba(9, 14, 23, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--dark-border);
      z-index: 100;
    }

    .nav-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 76px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 1.8px;
      text-decoration: none;
      color: var(--text-light);
    }

    .logo img {
      height: 40px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.35));
    }

    .nav-links {
      display: flex;
      gap: 28px;
      align-items: center;
    }

    .nav-links a {
      color: var(--text-light-muted);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 600;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--emerald);
    }

    .btn-nav {
      background: var(--emerald);
      color: #042f2e !important;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 800;
      transition: background 0.2s, transform 0.2s;
    }

    .btn-nav:hover {
      background: #34d399;
      transform: translateY(-1px);
    }

    /* MÓDULO 1: HERO (DARK TECH ESMERALDA) */
    .hero {
      background:
        radial-gradient(circle at 80% 20%, rgba(16, 185, 129, 0.14), transparent 45%),
        radial-gradient(circle at 15% 80%, rgba(5, 150, 105, 0.1), transparent 40%),
        var(--dark-bg);
      padding: 84px 0 88px;
      border-bottom: 1px solid var(--dark-border);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.45fr 0.85fr;
      gap: 40px;
      align-items: center;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--emerald-soft);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      margin-bottom: 22px;
      text-transform: uppercase;
    }

    .hero h1 {
      font-size: clamp(2.1rem, 4.3vw, 3.2rem);
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: -0.5px;
      margin-bottom: 22px;
      color: var(--text-light);
    }

    .hero h1 span {
      color: var(--emerald);
    }

    .hero p {
      font-size: 1.1rem;
      color: var(--text-light-muted);
      margin-bottom: 34px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .btn-primary {
      background: var(--emerald);
      color: #042f2e;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 1rem;
      box-shadow: 0 4px 20px var(--emerald-glow);
      transition: transform 0.2s, background 0.2s;
    }

    .btn-primary:hover {
      background: #34d399;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: var(--dark-surface);
      border: 1px solid var(--dark-border);
      color: var(--text-light);
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      transition: border-color 0.2s, background 0.2s;
    }

    .btn-secondary:hover {
      border-color: var(--emerald);
      background: #162032;
    }

    /* PAINEL LATERAL DO HERO (DESTAQUE VISUAL DA MARCA) */
    .hero-panel {
      background: var(--dark-surface);
      border: 1px solid var(--dark-border);
      border-top: 3px solid var(--emerald);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    .hero-panel-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-bottom: 18px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--dark-border);
    }

    .hero-panel-header img {
      height: 46px;
      width: auto;
    }

    .hero-panel-header strong {
      display: block;
      font-size: 1rem;
      letter-spacing: 1px;
    }

    .hero-panel-header span {
      font-size: 0.8rem;
      color: var(--emerald);
      font-weight: 700;
    }

    .spec-list {
      list-style: none;
      display: grid;
      gap: 12px;
    }

    .spec-list li {
      background: var(--dark-bg);
      border: 1px solid var(--dark-border);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      color: var(--text-light-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .spec-list li strong {
      color: var(--text-light);
      font-weight: 700;
    }

    .spec-tag {
      color: var(--emerald);
      font-weight: 800;
      font-size: 0.75rem;
    }

    /* MÓDULO 2: SOLUÇÕES (FUNDO ARDÓSIA CLARA COM MÓDULOS COLORIDOS) */
    .sec-solucoes {
      background-color: var(--light-bg);
      color: var(--text-dark);
      padding: 84px 0;
    }

    .section-tag {
      color: var(--emerald-dark);
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.8px;
      margin-bottom: 8px;
      display: block;
    }

    .sec-solucoes .section-title {
      font-size: 2rem;
      font-weight: 900;
      margin-bottom: 12px;
      color: var(--text-dark);
    }

    .sec-solucoes .section-desc {
      color: var(--text-dark-body);
      max-width: 680px;
      margin-bottom: 44px;
      font-size: 1.02rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
    }

    .solution-card {
      background: var(--light-surface);
      border: 1px solid var(--light-border);
      border-top: 4px solid var(--emerald);
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .solution-card.mod-blue { border-top-color: #0284c7; }
    .solution-card.mod-amber { border-top-color: #d97706; }
    .solution-card.mod-teal { border-top-color: #0d9488; }

    .solution-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.09);
    }

    .solution-icon {
      display: inline-block;
      background: #ecfdf5;
      color: var(--emerald-dark);
      font-weight: 800;
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 5px 12px;
      border-radius: 6px;
      margin-bottom: 14px;
    }

    .mod-blue .solution-icon { background: #e0f2fe; color: #0369a1; }
    .mod-amber .solution-icon { background: #fef3c7; color: #b45309; }
    .mod-teal .solution-icon { background: #ccfbf1; color: #0f766e; }

    .solution-card h3 {
      font-size: 1.25rem;
      margin-bottom: 10px;
      color: var(--text-dark);
    }

    .solution-card p {
      color: var(--text-dark-body);
      font-size: 0.95rem;
    }

    /* MÓDULO 3: PROJETOS EM PRODUÇÃO (SALA DE CONTROLE DARK) */
    .sec-projetos {
      background: linear-gradient(180deg, #0b111e 0%, #0f172a 100%);
      color: var(--text-light);
      padding: 84px 0;
      border-top: 1px solid var(--dark-border);
      border-bottom: 1px solid var(--dark-border);
    }

    .sec-projetos .section-tag { color: var(--emerald); }
    .sec-projetos .section-title { font-size: 2rem; font-weight: 900; margin-bottom: 12px; }
    .sec-projetos .section-desc { color: var(--text-light-muted); max-width: 680px; margin-bottom: 44px; font-size: 1.02rem; }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 24px;
    }

    .case-card {
      background: var(--dark-surface);
      border: 1px solid var(--dark-border);
      border-radius: 14px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s, transform 0.2s;
    }

    .case-card:hover {
      border-color: var(--emerald);
      transform: translateY(-3px);
    }

    .case-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 4px 12px;
      border-radius: 99px;
      background: var(--emerald-soft);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.25);
      margin-bottom: 16px;
      width: fit-content;
    }

    .case-card h3 {
      font-size: 1.2rem;
      margin-bottom: 10px;
      color: var(--text-light);
    }

    .case-card p {
      color: var(--text-light-muted);
      font-size: 0.94rem;
      margin-bottom: 20px;
    }

    .tech-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 16px;
      border-top: 1px solid var(--dark-border);
    }

    .tech-tags span {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-light-muted);
      background: var(--dark-bg);
      border: 1px solid var(--dark-border);
      padding: 4px 10px;
      border-radius: 6px;
    }

    /* MÓDULO 4: EXPERIÊNCIA & CONTATO (MODULAR CLARO) */
    .sec-sobre {
      background-color: var(--light-bg);
      color: var(--text-dark);
      padding: 84px 0;
    }

    .about-box {
      background: var(--light-surface);
      border: 1px solid var(--light-border);
      border-left: 6px solid var(--emerald-dark);
      border-radius: 16px;
      padding: 38px;
      display: grid;
      grid-template-columns: 1.75fr 1fr;
      gap: 32px;
      align-items: center;
      box-shadow: 0 6px 24px rgba(15, 23, 42, 0.06);
      margin-bottom: 48px;
    }

    .about-box h2 {
      font-size: 2rem;
      font-weight: 900;
      margin-bottom: 14
